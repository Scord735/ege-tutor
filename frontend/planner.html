            <div style="display:flex; gap:8px; margin-top:16px; flex-wrap:wrap;">

                <button id="loadDateBtn">Загрузить день</button>
                <button id="prevDayBtn">← Пред</button>
                <button id="nextDayBtn">След →</button>
            </div>
        </div>

        <div class="section">
            <div class="section-title">план дня</div>
            <div id="planContainer">
                <div class="placeholder">[ выбери дату и нажми «Загрузить день» ]</div>
            </div>
        </div>

        <div class="section">
            <div class="section-title">фазы обучения</div>
            <div id="phasesContainer">
                <div class="placeholder">[ загрузка... ]</div>
            </div>
